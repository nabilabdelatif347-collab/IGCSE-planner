    />
    <meta name="theme-color" content="#0b0b14" />
    <script>
      // Paint the saved theme before React loads, so reloads never flash the wrong colours.
      // applyTheme() in src/theme/engine.ts caches { mode, vars } under this key.
      (function () {
        var root = document.documentElement;
        var mode = 'dark';
        try {
          var c = JSON.parse(localStorage.getItem('igcse-planner:theme-vars') || 'null');
          if (c && c.vars) {
            for (var k in c.vars) if (k.indexOf('--color-') === 0) root.style.setProperty(k, c.vars[k]);
            if (c.mode === 'light') mode = 'light';
          }
        } catch (e) {}
        root.setAttribute('data-mode', mode);
        if (mode === 'dark') root.classList.add('dark');
      })();
    </script>
